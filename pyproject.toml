[project]
name = "agent-bench"
version = "0.1.0"
description = "Local enterprise Agent testing and workflow orchestration app"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.75,<1",
    "fastapi>=0.115,<1",
    "httpx[socks]>=0.28,<1",
    "langchain>=1.0,<2",
    "langchain-anthropic>=1.0,<2",
    "langchain-deepseek>=1.1,<2",
    "langchain-google-genai>=4.0,<5",
    "langchain-openai>=1.0,<2",
    "langchain-tavily>=0.2.18",
    "pydantic>=2.12,<3",
    "rich>=13.9,<15",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: runs real DeepSeek and DashScope model gateway calls when provider API key environment variables are set",
]
