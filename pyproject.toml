[project]
name = "agent-bench"
version = "0.1.0"
description = "Local enterprise Agent testing and workflow orchestration app"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18,<2",
    "apscheduler>=3.11,<4",
    "fastapi>=0.115,<1",
    "httpx[socks]>=0.28,<1",
    "pydantic>=2.12,<3",
    "requests>=2.32,<3",
    "sse-starlette>=3.0,<4",
    "sqlalchemy>=2.0,<3",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: runs real DeepSeek and DashScope model gateway calls when provider API key environment variables are set",
]
