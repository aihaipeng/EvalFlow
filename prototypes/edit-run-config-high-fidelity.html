  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;run-config-clickable&quot;&gt;
  &lt;style&gt;
    #run-config-clickable { width: 100%; color: var(--foreground); }
    #run-config-clickable * { box-sizing: border-box; }
    #run-config-clickable .shell { display: grid; width: 100%; gap: 20px; }
    #run-config-clickable .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    #run-config-clickable .heading { display: grid; gap: 6px; min-width: 0; }
    #run-config-clickable .crumb { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
    #run-config-clickable .crumb strong { font-weight: 500; }
    #run-config-clickable .run-context { display: flex; align-items: center; gap: 8px; color: var(--muted-foreground); flex-wrap: wrap; }
    #run-config-clickable .top-actions, #run-config-clickable .footer-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    #run-config-clickable .notice { display: flex; align-items: flex-start; gap: 10px; }
    #run-config-clickable .notice-copy { display: grid; gap: 3px; min-width: 0; }
    #run-config-clickable .notice-copy strong { font-weight: 500; }
    #run-config-clickable .section { display: grid; gap: 14px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
    #run-config-clickable .section:last-of-type { border-bottom: 0; }
    #run-config-clickable .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    #run-config-clickable .section-head h3 { margin: 0; font-weight: 500; }
    #run-config-clickable .section-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--muted-foreground); }
    #run-config-clickable .fields { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    #run-config-clickable .field { display: grid; align-content: start; gap: 6px; min-width: 0; }
    #run-config-clickable .field.span-2 { grid-column: span 2; }
    #run-config-clickable .field &gt; span:first-child { color: var(--muted-foreground); }
    #run-config-clickable .field-error:empty { display: none; }
    #run-config-clickable .mapping { display: grid; border-top: 1px solid var(--border); }
    #run-config-clickable .mapping-row { display: grid; grid-template-columns: 56px minmax(130px, .65fr) minmax(250px, 1.35fr); align-items: center; gap: 12px; min-height: 48px; padding: 7px 8px; border-bottom: 1px solid var(--border); }
    #run-config-clickable .mapping-head { color: var(--muted-foreground); background: color-mix(in srgb, var(--muted) 58%, transparent); }
    #run-config-clickable .mapping-source { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #run-config-clickable .mapping-target { display: grid; gap: 4px; min-width: 0; }
    #run-config-clickable .mapping-target input { width: 100%; min-width: 0; }
    #run-config-clickable .judge-config { display: grid; grid-template-columns: minmax(220px, .75fr) minmax(460px, 1.55fr); gap: 16px; align-items: end; }
    #run-config-clickable .result-source { display: grid; gap: 6px; min-width: 0; }
    #run-config-clickable .result-source &gt; span:first-child { color: var(--muted-foreground); }
    #run-config-clickable .source-fields { display: grid; grid-template-columns: 190px minmax(240px, 1fr); gap: 10px; min-width: 0; }
    #run-config-clickable .source-fields textarea { min-height: 120px; resize: vertical; }
    #run-config-clickable .checkpoint-details { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    #run-config-clickable .checkpoint-summary { min-height: 48px; padding: 10px 0; cursor: pointer; }
    #run-config-clickable .checkpoint-title { display: inline-flex; align-items: center; gap: 8px; margin-left: 6px; }
    #run-config-clickable .checkpoint-title strong { font-weight: 500; }
    #run-config-clickable .checkpoint-body { display: grid; gap: 10px; padding-bottom: 10px; }
    #run-config-clickable .checkpoint-toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
    #run-config-clickable .rule-table { display: grid; border-top: 1px solid var(--border); }
    #run-config-clickable .rule-head, #run-config-clickable .rule-row { display: grid; grid-template-columns: 48px minmax(220px, 1fr) 150px minmax(220px, 1fr) 36px; align-items: start; gap: 10px; border-bottom: 1px solid var(--border); }
    #run-config-clickable .rule-head { min-height: 40px; align-items: center; color: var(--muted-foreground); background: color-mix(in srgb, var(--muted) 58%, transparent); }
    #run-config-clickable .rule-row { padding: 9px 0; }
    #run-config-clickable .rule-row.is-new { background: color-mix(in srgb, var(--accent) 30%, transparent); }
    #run-config-clickable .rule-index { align-self: center; color: var(--muted-foreground); text-align: center; }
    #run-config-clickable .rule-cell { display: grid; gap: 4px; min-width: 0; }
    #run-config-clickable .rule-cell input, #run-config-clickable .rule-cell select { width: 100%; min-width: 0; }
    #run-config-clickable .mobile-label { display: none; color: var(--muted-foreground); }
    #run-config-clickable .rules-empty { display: grid; justify-items: start; gap: 8px; padding: 20px 0; color: var(--muted-foreground); }
    #run-config-clickable .footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-top: 16px; border-top: 1px solid var(--border); }
    #run-config-clickable .create-hint { color: var(--muted-foreground); }
    #run-config-clickable .prototype-dialog { width: min(650px, calc(100% - 28px)); max-height: 84vh; overflow: auto; color: var(--popover-foreground); background: var(--popover); }
    #run-config-clickable .prototype-dialog::backdrop { background: color-mix(in srgb, var(--foreground) 32%, transparent); }
    #run-config-clickable .dialog-body { display: grid; gap: 16px; }
    #run-config-clickable .dialog-head { display: flex; align-items: flex-start; gap: 10px; }
    #run-config-clickable .dialog-head-copy { display: grid; gap: 4px; }
    #run-config-clickable .dialog-head-copy strong { font-weight: 500; }
    #run-config-clickable .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    #run-config-clickable .review { display: grid; border-top: 1px solid var(--border); }
    #run-config-clickable .review-row { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 10px; min-height: 38px; align-items: center; border-bottom: 1px solid var(--border); }
    #run-config-clickable .review-row span:first-child { color: var(--muted-foreground); }
    #run-config-clickable .hidden { display: none !important; }

    @media (max-width: 1080px) {
      #run-config-clickable .fields { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      #run-config-clickable .judge-config { grid-template-columns: minmax(200px, .7fr) minmax(420px, 1.3fr); }
    }
    @media (max-width: 760px) {
      #run-config-clickable .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #run-config-clickable .judge-config { grid-template-columns: 1fr; }
      #run-config-clickable .source-fields { grid-template-columns: minmax(150px, .5fr) minmax(220px, 1.5fr); }
      #run-config-clickable .rule-head { display: none; }
      #run-config-clickable .rule-row { grid-template-columns: 40px minmax(0, 1fr); padding: 12px 0; }
      #run-config-clickable .rule-index { grid-row: 1 / 4; }
      #run-config-clickable .rule-cell { grid-column: 2; }
      #run-config-clickable .rule-row &gt; button { grid-column: 2; justify-self: start; }
      #run-config-clickable .mobile-label { display: block; }
    }
    @media (max-width: 520px) {
      #run-config-clickable .topbar, #run-config-clickable .footer { align-items: stretch; flex-direction: column; }
      #run-config-clickable .top-actions, #run-config-clickable .footer-actions { width: 100%; }
      #run-config-clickable .top-actions .btn, #run-config-clickable .footer-actions .btn { flex: 1; }
      #run-config-clickable .fields, #run-config-clickable .source-fields { grid-template-columns: 1fr; }
      #run-config-clickable .field.span-2 { grid-column: span 1; }
      #run-config-clickable .mapping-head { display: none; }
      #run-config-clickable .mapping-row { grid-template-columns: 32px minmax(0, 1fr); padding: 10px 0; }
      #run-config-clickable .mapping-target { grid-column: 2; }
      #run-config-clickable .checkpoint-toolbar { align-items: flex-start; flex-direction: column; }
      #run-config-clickable .review-row { grid-template-columns: 1fr; gap: 2px; padding: 7px 0; }
    }
  &lt;/style&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;run-config-clickable&#x27;);
      const clone = value =&gt; JSON.parse(JSON.stringify(value));
      const escapeHtml = value =&gt; String(value).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, char =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[char]));
      const refreshIcons = () =&gt; globalThis.lucide?.createIcons({attrs: {width: 16, height: 16}});
      const datasets = {
        &#x27;skill测试集.xlsx&#x27;: {rows: 10, columns: 5, sheets: [&#x27;Sheet1&#x27;, &#x27;回归样例&#x27;]},
        &#x27;CMDB回归集.xlsx&#x27;: {rows: 24, columns: 5, sheets: [&#x27;smoke&#x27;, &#x27;full&#x27;]}
      };

      function checksValue(index) {
        return {
          checks: {
            intent: {status: &#x27;PASS&#x27;, detail: index === 1 ? &#x27;意图匹配且参数完整&#x27; : &#x27;意图正确&#x27;},
            i18n: {status: index === 1 ? &#x27;FAIL&#x27; : &#x27;PASS&#x27;, detail: index === 1 ? &#x27;包含英文句子&#x27; : &#x27;中文合规&#x27;},
            tool_choice: {status: index === 2 ? &#x27;FAIL&#x27; : &#x27;PASS&#x27;, detail: index === 2 ? &#x27;期望工具未调用&#x27; : &#x27;工具调用正确&#x27;}
          }
        };
      }

      const expectedResultCases = Array.from({length: 10}, (_, index) =&gt; ({
        id: &#x27;case_&#x27; + String(index + 1).padStart(3, &#x27;0&#x27;),
        row: index + 2,
        value: checksValue(index)
      }));
      expectedResultCases[4] = {
        id: &#x27;case_005&#x27;,
        row: 6,
        raw: &#x27;{&quot;checks&quot;:{&quot;intent&quot;:{&quot;status&quot;:&quot;PASS&quot;},&quot;i18n&quot;:{&quot;status&quot;:&quot;PASS&quot;}&#x27;,
        parseError: &#x27;第 1 行第 70 列附近缺少 }&#x27;
      };
      expectedResultCases[7] = {
        id: &#x27;case_008&#x27;,
        row: 9,
        value: {checks: {intent: {status: &#x27;PASS&#x27;, detail: &#x27;意图正确&#x27;}, tool_choice: {status: &#x27;PASS&#x27;, detail: &#x27;工具调用正确&#x27;}}}
      };

      const expectedMetaCases = Array.from({length: 10}, (_, index) =&gt; ({
        id: &#x27;case_&#x27; + String(index + 1).padStart(3, &#x27;0&#x27;),
        row: index + 2,
        value: {
          answer: {contains: index % 2 ? [&#x27;设备&#x27;, &#x27;在线&#x27;] : [&#x27;交换机&#x27;, &#x27;在线&#x27;], max_latency_ms: 3000},
          tool: {name: &#x27;cmdb_query&#x27;, required: true}
        }
      }));

      const columnCases = {
        expected_result: expectedResultCases,
        expected_meta: expectedMetaCases
      };

      const initialState = {
        config: {
          name: &#x27;CMDB Agent 回归 · 修正版&#x27;, dataset: &#x27;skill测试集.xlsx&#x27;, sheet: &#x27;Sheet1&#x27;, workflow: &#x27;cmdb&#x27;,
          headerMode: &#x27;HEADER&#x27;, caseIdColumn: &#x27;case_id&#x27;, concurrency: 4
        },
        mappings: [
          {source: &#x27;case_id&#x27;, enabled: false, target: &#x27;&#x27;},
          {source: &#x27;question&#x27;, enabled: true, target: &#x27;input.question&#x27;},
          {source: &#x27;category&#x27;, enabled: true, target: &#x27;input.category&#x27;},
          {source: &#x27;expected_result&#x27;, enabled: false, target: &#x27;&#x27;},
          {source: &#x27;expected_meta&#x27;, enabled: false, target: &#x27;&#x27;}
        ],
        expectedSource: &#x27;EXCEL&#x27;,
        expectedColumn: &#x27;expected_result&#x27;,
        evaluationName: &#x27;结果正确性&#x27;,
        literalText: &#x27;{\n  &quot;checks&quot;: {\n    &quot;intent&quot;: {&quot;status&quot;: &quot;PASS&quot;, &quot;detail&quot;: &quot;意图正确&quot;},\n    &quot;i18n&quot;: {&quot;status&quot;: &quot;PASS&quot;, &quot;detail&quot;: &quot;中文合规&quot;}\n  }\n}&#x27;,
        rules: [
          {expectedPath: &#x27;body.checks.intent.status&#x27;, operator: &#x27;EQ&#x27;, actualPath: &#x27;answer.checks.intent.status&#x27;},
          {expectedPath: &#x27;body.checks.i18n.status&#x27;, operator: &#x27;EQ&#x27;, actualPath: &#x27;answer.checks.i18n.status&#x27;}
        ]
      };

      let state = clone(initialState);
      let dirty = false;
      let validation = {};

      const operators = [
        [&#x27;EQ&#x27;, &#x27;等于&#x27;], [&#x27;NE&#x27;, &#x27;不等于&#x27;], [&#x27;CONTAINS&#x27;, &#x27;包含&#x27;], [&#x27;REGEX&#x27;, &#x27;正则&#x27;],
        [&#x27;EXISTS&#x27;, &#x27;存在&#x27;], [&#x27;GT&#x27;, &#x27;大于&#x27;], [&#x27;GTE&#x27;, &#x27;大于等于&#x27;], [&#x27;LT&#x27;, &#x27;小于&#x27;], [&#x27;LTE&#x27;, &#x27;小于等于&#x27;], [&#x27;JSON_EQUAL&#x27;, &#x27;JSON 相等&#x27;]
      ];

      function currentCases() {
        const base = columnCases[state.expectedColumn] || [];
        const total = datasets[state.config.dataset]?.rows || base.length;
        if (total &lt;= base.length) return base.slice(0, total);
        const extra = Array.from({length: total - base.length}, (_, offset) =&gt; {
          const index = base.length + offset;
          const value = state.expectedColumn === &#x27;expected_result&#x27;
            ? checksValue(index)
            : {answer: {contains: [&#x27;设备&#x27;, &#x27;在线&#x27;], max_latency_ms: 3000}, tool: {name: &#x27;cmdb_query&#x27;, required: true}};
          return {id: &#x27;case_&#x27; + String(index + 1).padStart(3, &#x27;0&#x27;), row: index + 2, value};
        });
        return [...base, ...extra];
      }

      function parseLiteral() {
        try { return {value: JSON.parse(state.literalText), error: null}; }
        catch (error) { return {value: null, error: error.message}; }
      }

      function currentPreview() {
        if (state.expectedSource === &#x27;LITERAL&#x27;) {
          const parsed = parseLiteral();
          return parsed.error ? {raw: state.literalText, parseError: parsed.error} : {id: &#x27;自定义 body&#x27;, row: null, value: parsed.value};
        }
        return currentCases()[0];
      }

      function markDirty() {
        dirty = true;
        root.querySelector(&#x27;#dirty-badge&#x27;).textContent = &#x27;已修改&#x27;;
      }

      function showNotice(title, detail = &#x27;&#x27;, kind = &#x27;info&#x27;) {
        const notice = root.querySelector(&#x27;#notice&#x27;);
        notice.classList.remove(&#x27;hidden&#x27;);
        root.querySelector(&#x27;#notice-title&#x27;).textContent = title;
        root.querySelector(&#x27;#notice-detail&#x27;).textContent = detail;
        const icon = notice.querySelector(&#x27;i, svg&#x27;);
        if (icon) {
          const replacement = document.createElement(&#x27;i&#x27;);
          replacement.dataset.lucide = kind === &#x27;error&#x27; ? &#x27;circle-alert&#x27; : kind === &#x27;success&#x27; ? &#x27;circle-check&#x27; : &#x27;info&#x27;;
          replacement.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
          icon.replaceWith(replacement);
        }
        if (kind === &#x27;error&#x27;) root.querySelector(&#x27;#notice-title&#x27;).classList.add(&#x27;text-destructive&#x27;);
        else root.querySelector(&#x27;#notice-title&#x27;).classList.remove(&#x27;text-destructive&#x27;);
        refreshIcons();
      }

      function hideNotice() {
        root.querySelector(&#x27;#notice&#x27;).classList.add(&#x27;hidden&#x27;);
      }

      function renderDataset() {
        const meta = datasets[state.config.dataset];
        root.querySelector(&#x27;#dataset-meta&#x27;).textContent = `${meta.rows} 行 · ${meta.columns} 列`;
        const sheet = root.querySelector(&#x27;#sheet&#x27;);
        sheet.innerHTML = meta.sheets.map(name =&gt; `&lt;option${name === state.config.sheet ? &#x27; selected&#x27; : &#x27;&#x27;}&gt;${escapeHtml(name)}&lt;/option&gt;`).join(&#x27;&#x27;);
        if (!meta.sheets.includes(state.config.sheet)) {
          state.config.sheet = meta.sheets[0];
          sheet.value = state.config.sheet;
        }
      }

      function renderMapping() {
        const table = root.querySelector(&#x27;#mapping-table&#x27;);
        table.innerHTML = `
          &lt;div class=&quot;mapping-row mapping-head&quot; role=&quot;row&quot;&gt;&lt;span&gt;启用&lt;/span&gt;&lt;span&gt;Excel 列&lt;/span&gt;&lt;span&gt;START 变量或对象字段&lt;/span&gt;&lt;/div&gt;
          ${state.mappings.map((mapping, index) =&gt; `
            &lt;div class=&quot;mapping-row&quot; role=&quot;row&quot; data-mapping-index=&quot;${index}&quot;&gt;
              &lt;label class=&quot;form-check&quot;&gt;&lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-mapping-enabled ${mapping.enabled ? &#x27;checked&#x27; : &#x27;&#x27;} aria-label=&quot;启用 ${escapeHtml(mapping.source)} 映射&quot; /&gt;&lt;/label&gt;
              &lt;code class=&quot;mapping-source&quot;&gt;${escapeHtml(mapping.source)}&lt;/code&gt;
              &lt;label class=&quot;mapping-target&quot;&gt;&lt;span class=&quot;sr-only&quot;&gt;${escapeHtml(mapping.source)} 的 START 目标&lt;/span&gt;&lt;input class=&quot;form-control&quot; data-mapping-target value=&quot;${escapeHtml(mapping.target)}&quot; placeholder=&quot;例如 input.${escapeHtml(mapping.source)}&quot; ${mapping.enabled ? &#x27;&#x27; : &#x27;disabled&#x27;} /&gt;&lt;span class=&quot;field-error text-destructive&quot;&gt;${escapeHtml(validation[&#x27;mapping-&#x27; + index] || &#x27;&#x27;)}&lt;/span&gt;&lt;/label&gt;
            &lt;/div&gt;`).join(&#x27;&#x27;)}`;
        root.querySelector(&#x27;#mapping-count&#x27;).textContent = `${state.mappings.filter(item =&gt; item.enabled).length} 个字段已映射`;
      }

      function renderSourceControls() {
        const isExcel = state.expectedSource === &#x27;EXCEL&#x27;;
        root.querySelector(&#x27;#expected-column&#x27;).classList.toggle(&#x27;hidden&#x27;, !isExcel);
        root.querySelector(&#x27;#literal-json&#x27;).classList.toggle(&#x27;hidden&#x27;, isExcel);
        root.querySelector(&#x27;#literal-json&#x27;).value = state.literalText;
        renderBodyPathOptions();
      }

      function renderRules() {
        const table = root.querySelector(&#x27;#rule-table&#x27;);
        if (!state.rules.length) {
          table.innerHTML = &#x27;&lt;div class=&quot;rules-empty&quot;&gt;&lt;span&gt;尚未配置校验点&lt;/span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-empty-add&gt;&lt;i data-lucide=&quot;plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;添加第一个校验点&lt;/button&gt;&lt;/div&gt;&#x27;;
          table.querySelector(&#x27;[data-empty-add]&#x27;).addEventListener(&#x27;click&#x27;, addBlankRule);
          root.querySelector(&#x27;#rule-count&#x27;).textContent = &#x27;0&#x27;;
          updateFooterHint();
          refreshIcons();
          return;
        }
        table.innerHTML = `
          &lt;div class=&quot;rule-head&quot; role=&quot;row&quot;&gt;&lt;span&gt;#&lt;/span&gt;&lt;span&gt;期望结果&lt;/span&gt;&lt;span&gt;运算符&lt;/span&gt;&lt;span&gt;实际结果&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
          ${state.rules.map((rule, index) =&gt; `
            &lt;div class=&quot;rule-row${rule.isNew ? &#x27; is-new&#x27; : &#x27;&#x27;}&quot; role=&quot;row&quot; data-rule-index=&quot;${index}&quot;&gt;
              &lt;span class=&quot;rule-index&quot;&gt;${index + 1}&lt;/span&gt;
              &lt;label class=&quot;rule-cell&quot;&gt;&lt;span class=&quot;mobile-label&quot;&gt;期望结果&lt;/span&gt;&lt;input class=&quot;form-control&quot; data-rule-field=&quot;expectedPath&quot; value=&quot;${escapeHtml(rule.expectedPath)}&quot; placeholder=&quot;body.xxx&quot; list=&quot;body-paths&quot; aria-label=&quot;校验点 ${index + 1} 期望结果&quot; aria-invalid=&quot;${validation[&#x27;rule-&#x27; + index + &#x27;-expectedPath&#x27;] ? &#x27;true&#x27; : &#x27;false&#x27;}&quot; /&gt;&lt;span class=&quot;field-error text-destructive&quot;&gt;${escapeHtml(validation[&#x27;rule-&#x27; + index + &#x27;-expectedPath&#x27;] || &#x27;&#x27;)}&lt;/span&gt;&lt;/label&gt;
              &lt;label class=&quot;rule-cell&quot;&gt;&lt;span class=&quot;mobile-label&quot;&gt;运算符&lt;/span&gt;&lt;select class=&quot;form-select&quot; data-rule-field=&quot;operator&quot; aria-label=&quot;校验点 ${index + 1} 运算符&quot;&gt;${operators.map(([value, label]) =&gt; `&lt;option value=&quot;${value}&quot;${value === rule.operator ? &#x27; selected&#x27; : &#x27;&#x27;}&gt;${label}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/label&gt;
              &lt;label class=&quot;rule-cell&quot;&gt;&lt;span class=&quot;mobile-label&quot;&gt;实际结果&lt;/span&gt;&lt;input class=&quot;form-control&quot; data-rule-field=&quot;actualPath&quot; value=&quot;${escapeHtml(rule.actualPath)}&quot; placeholder=&quot;answer.xxx&quot; aria-label=&quot;校验点 ${index + 1} 实际结果&quot; aria-invalid=&quot;${validation[&#x27;rule-&#x27; + index + &#x27;-actualPath&#x27;] ? &#x27;true&#x27; : &#x27;false&#x27;}&quot; /&gt;&lt;span class=&quot;field-error text-destructive&quot;&gt;${escapeHtml(validation[&#x27;rule-&#x27; + index + &#x27;-actualPath&#x27;] || &#x27;&#x27;)}&lt;/span&gt;&lt;/label&gt;
              &lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-rule-delete aria-label=&quot;删除校验点 ${index + 1}&quot; data-tooltip=&quot;删除校验点&quot;&gt;&lt;i data-lucide=&quot;trash-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;
            &lt;/div&gt;`).join(&#x27;&#x27;)}`;
        root.querySelector(&#x27;#rule-count&#x27;).textContent = String(state.rules.length);
        renderBodyPathOptions();
        updateFooterHint();
        refreshIcons();
      }

      function updateFooterHint() {
        const total = datasets[state.config.dataset].rows;
        root.querySelector(&#x27;#create-hint&#x27;).textContent = `${total} 个 Case · ${state.rules.length} 个校验点`;
      }

      function renderBodyPathOptions() {
        let list = root.querySelector(&#x27;#body-paths&#x27;);
        if (!list) {
          list = document.createElement(&#x27;datalist&#x27;);
          list.id = &#x27;body-paths&#x27;;
          root.appendChild(list);
        }
        const preview = currentPreview();
        if (!preview || preview.parseError || preview.value === null || typeof preview.value !== &#x27;object&#x27;) {
          list.innerHTML = &#x27;&#x27;;
          return;
        }
        const paths = [];
        const visit = (value, prefix = &#x27;body&#x27;) =&gt; {
          Object.entries(value || {}).forEach(([key, child]) =&gt; {
            const path = `${prefix}.${key}`;
            if (child !== null &amp;&amp; typeof child === &#x27;object&#x27; &amp;&amp; !Array.isArray(child)) visit(child, path);
            else paths.push(path);
          });
        };
        visit(preview.value);
        list.innerHTML = paths.map(path =&gt; `&lt;option value=&quot;${escapeHtml(path)}&quot;&gt;&lt;/option&gt;`).join(&#x27;&#x27;);
      }

      function addBlankRule() {
        state.rules.push({expectedPath: &#x27;body.&#x27;, operator: &#x27;EQ&#x27;, actualPath: &#x27;answer.&#x27;, isNew: true});
        validation = {};
        markDirty();
        renderRules();
        updateFooterHint();
        const inputs = root.querySelectorAll(&#x27;[data-rule-field=&quot;expectedPath&quot;]&#x27;);
        if (inputs.length) inputs[inputs.length - 1].focus();
      }

      function validateConfiguration() {
        validation = {};
        let firstSelector = null;
        if (!state.config.name.trim()) {
          validation.name = &#x27;名称不能为空&#x27;;
          firstSelector = &#x27;#run-name&#x27;;
        }
        if (!state.evaluationName.trim()) {
          validation.evaluationName = &#x27;校验名称不能为空&#x27;;
          firstSelector ||= &#x27;#evaluation-name&#x27;;
        }
        if (state.expectedSource === &#x27;LITERAL&#x27; &amp;&amp; parseLiteral().error) {
          validation.source = &#x27;自定义内容必须是合法 JSON&#x27;;
          firstSelector ||= &#x27;#literal-json&#x27;;
        }
        const concurrency = Number(state.config.concurrency);
        if (!Number.isInteger(concurrency) || concurrency &lt; 1 || concurrency &gt; 32) {
          validation.concurrency = &#x27;请输入 1 到 32 的整数&#x27;;
          firstSelector ||= &#x27;#concurrency&#x27;;
        }
        const enabledMappings = state.mappings.filter(item =&gt; item.enabled);
        if (!enabledMappings.length) {
          validation[&#x27;mapping-0&#x27;] = &#x27;请至少启用一个输入映射&#x27;;
          firstSelector ||= &#x27;[data-mapping-enabled]&#x27;;
        }
        state.mappings.forEach((mapping, index) =&gt; {
          if (mapping.enabled &amp;&amp; !mapping.target.trim()) {
            validation[&#x27;mapping-&#x27; + index] = &#x27;启用后必须填写目标变量&#x27;;
            firstSelector ||= `[data-mapping-index=&quot;${index}&quot;] [data-mapping-target]`;
          }
        });
        if (!state.rules.length) {
          validation.rules = &#x27;请至少配置一个校验点&#x27;;
          firstSelector ||= &#x27;#add-rule&#x27;;
        }
        state.rules.forEach((rule, index) =&gt; {
          if (!String(rule.expectedPath || &#x27;&#x27;).startsWith(&#x27;body.&#x27;) || rule.expectedPath.trim() === &#x27;body.&#x27;) {
            validation[`rule-${index}-expectedPath`] = &#x27;期望结果必须使用 body.xxx&#x27;;
            firstSelector ||= `[data-rule-index=&quot;${index}&quot;] [data-rule-field=&quot;expectedPath&quot;]`;
          }
          if (!String(rule.actualPath || &#x27;&#x27;).startsWith(&#x27;answer.&#x27;) || rule.actualPath.trim() === &#x27;answer.&#x27;) {
            validation[`rule-${index}-actualPath`] = &#x27;实际结果必须使用 answer.xxx&#x27;;
            firstSelector ||= `[data-rule-index=&quot;${index}&quot;] [data-rule-field=&quot;actualPath&quot;]`;
          }
        });
        root.querySelector(&#x27;#error-name&#x27;).textContent = validation.name || &#x27;&#x27;;
        root.querySelector(&#x27;#run-name&#x27;).setAttribute(&#x27;aria-invalid&#x27;, validation.name ? &#x27;true&#x27; : &#x27;false&#x27;);
        root.querySelector(&#x27;#error-concurrency&#x27;).textContent = validation.concurrency || &#x27;&#x27;;
        root.querySelector(&#x27;#concurrency&#x27;).setAttribute(&#x27;aria-invalid&#x27;, validation.concurrency ? &#x27;true&#x27; : &#x27;false&#x27;);
        root.querySelector(&#x27;#error-evaluation-name&#x27;).textContent = validation.evaluationName || &#x27;&#x27;;
        root.querySelector(&#x27;#evaluation-name&#x27;).setAttribute(&#x27;aria-invalid&#x27;, validation.evaluationName ? &#x27;true&#x27; : &#x27;false&#x27;);
        root.querySelector(&#x27;#error-source&#x27;).textContent = validation.source || &#x27;&#x27;;
        root.querySelector(&#x27;#literal-json&#x27;).setAttribute(&#x27;aria-invalid&#x27;, validation.source ? &#x27;true&#x27; : &#x27;false&#x27;);
        root.querySelector(&#x27;#rules-global-error&#x27;).textContent = validation.rules || &#x27;&#x27;;
        renderMapping();
        renderRules();
        if (Object.keys(validation).length) {
          showNotice(&#x27;配置尚未完成&#x27;, &#x27;请修正标出的字段后再创建&#x27;, &#x27;error&#x27;);
          const target = root.querySelector(firstSelector);
          if (target) target.focus();
          return false;
        }
        return true;
      }

      function openReview() {
        if (!validateConfiguration()) return;
        const total = datasets[state.config.dataset].rows;
        root.querySelector(&#x27;#review-content&#x27;).innerHTML = `
          &lt;div class=&quot;review-row&quot;&gt;&lt;span&gt;Run 名称&lt;/span&gt;&lt;strong&gt;${escapeHtml(state.config.name)}&lt;/strong&gt;&lt;/div&gt;
          &lt;div class=&quot;review-row&quot;&gt;&lt;span&gt;测试集&lt;/span&gt;&lt;span&gt;${escapeHtml(state.config.dataset)} / ${escapeHtml(state.config.sheet)}&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;review-row&quot;&gt;&lt;span&gt;Workflow&lt;/span&gt;&lt;span&gt;${escapeHtml(root.querySelector(&#x27;#workflow&#x27;).selectedOptions[0].textContent)}&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;review-row&quot;&gt;&lt;span&gt;规模&lt;/span&gt;&lt;span&gt;${total} 个 Case · 并发 ${state.config.concurrency}&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;review-row&quot;&gt;&lt;span&gt;结果判定&lt;/span&gt;&lt;span&gt;${escapeHtml(state.evaluationName)} · ${state.rules.length} 个校验点&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;review-row&quot;&gt;&lt;span&gt;结果来源&lt;/span&gt;&lt;span&gt;${state.expectedSource === &#x27;EXCEL&#x27; ? `Excel / ${escapeHtml(state.expectedColumn)}` : &#x27;自定义 JSON&#x27;}&lt;/span&gt;&lt;/div&gt;`;
        root.querySelector(&#x27;#review-stage&#x27;).classList.remove(&#x27;hidden&#x27;);
        root.querySelector(&#x27;#success-stage&#x27;).classList.add(&#x27;hidden&#x27;);
        root.querySelector(&#x27;#create-dialog&#x27;).showModal();
      }

      function resetState() {
        state = clone(initialState);
        dirty = false;
        validation = {};
        root.querySelector(&#x27;#run-name&#x27;).value = state.config.name;
        root.querySelector(&#x27;#dataset&#x27;).value = state.config.dataset;
        root.querySelector(&#x27;#workflow&#x27;).value = state.config.workflow;
        root.querySelector(&#x27;#header-mode&#x27;).value = state.config.headerMode;
        root.querySelector(&#x27;#case-id-column&#x27;).value = state.config.caseIdColumn;
        root.querySelector(&#x27;#concurrency&#x27;).value = state.config.concurrency;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
