      };

      const typeOptions = [
        [&#x27;string&#x27;, &#x27;string&#x27;], [&#x27;number&#x27;, &#x27;number&#x27;], [&#x27;integer&#x27;, &#x27;integer&#x27;], [&#x27;boolean&#x27;, &#x27;boolean&#x27;],
        [&#x27;object&#x27;, &#x27;object&#x27;], [&#x27;array&#x27;, &#x27;array&#x27;], [&#x27;null&#x27;, &#x27;null&#x27;]
      ];
      const operators = [
        [&#x27;EQ&#x27;, &#x27;等于&#x27;], [&#x27;NE&#x27;, &#x27;不等于&#x27;], [&#x27;CONTAINS&#x27;, &#x27;包含&#x27;], [&#x27;REGEX&#x27;, &#x27;正则匹配&#x27;],
        [&#x27;EXISTS&#x27;, &#x27;存在&#x27;], [&#x27;GT&#x27;, &#x27;大于&#x27;], [&#x27;GTE&#x27;, &#x27;大于等于&#x27;], [&#x27;LT&#x27;, &#x27;小于&#x27;], [&#x27;LTE&#x27;, &#x27;小于等于&#x27;]
      ];

      const initialState = {
        config: {
          name: &#x27;CMDB Agent 回归 · 修正版&#x27;, dataset: &#x27;skill测试集.xlsx&#x27;, sheet: &#x27;Sheet1&#x27;, workflow: &#x27;cmdb&#x27;,
          headerMode: &#x27;HEADER&#x27;, concurrency: 4
        },
        variables: [
          {id: 1, source: &#x27;EXCEL&#x27;, key: &#x27;question&#x27;, value: &#x27;col_2&#x27;, type: &#x27;string&#x27;},
          {id: 2, source: &#x27;EXCEL&#x27;, key: &#x27;expected_intent&#x27;, value: &#x27;col_4.checks.intent.status&#x27;, type: &#x27;string&#x27;}
        ],
        evaluationName: &#x27;结果正确性&#x27;,
        rules: [
          {id: 1, resultPath: &#x27;context.final_answer.status&#x27;, operator: &#x27;EQ&#x27;, expectedValue: &#x27;PASS&#x27;, type: &#x27;string&#x27;},
          {id: 2, resultPath: &#x27;context.final_answer.score&#x27;, operator: &#x27;GTE&#x27;, expectedValue: &#x27;0.9&#x27;, type: &#x27;number&#x27;}
        ]
      };

      let state = clone(initialState);
      let validation = {};
      let dirty = false;
      let nextVariableId = 3;
      let nextRuleId = 3;

      function currentSheet() {
        return datasets[state.config.dataset].sheets[state.config.sheet];
      }

      function currentHeaders() {
        return currentSheet().headers;
      }

      function normalizeDatasetState() {
        const sheets = Object.keys(datasets[state.config.dataset].sheets);
        if (!sheets.includes(state.config.sheet)) state.config.sheet = sheets[0];
      }

      function markDirty() {
        dirty = true;
        root.querySelector(&#x27;#dirty-badge&#x27;).textContent = &#x27;已修改&#x27;;
      }

      function showNotice(title, detail) {
        root.querySelector(&#x27;#notice-title&#x27;).textContent = title;
        root.querySelector(&#x27;#notice-detail&#x27;).textContent = detail;
        root.querySelector(&#x27;#notice&#x27;).classList.remove(&#x27;hidden&#x27;);
        refreshIcons();
      }

      function hideNotice() {
        root.querySelector(&#x27;#notice&#x27;).classList.add(&#x27;hidden&#x27;);
      }

      function renderBasicOptions() {
        root.querySelector(&#x27;#dataset&#x27;).innerHTML = Object.keys(datasets).map(name =&gt; `&lt;option value=&quot;${escapeHtml(name)}&quot;${selected(name, state.config.dataset)}&gt;${escapeHtml(name)}&lt;/option&gt;`).join(&#x27;&#x27;);
        root.querySelector(&#x27;#sheet&#x27;).innerHTML = Object.keys(datasets[state.config.dataset].sheets).map(name =&gt; `&lt;option value=&quot;${escapeHtml(name)}&quot;${selected(name, state.config.sheet)}&gt;${escapeHtml(name)}&lt;/option&gt;`).join(&#x27;&#x27;);
      }

      function syncBasicFields() {
        renderBasicOptions();
        root.querySelector(&#x27;#run-name&#x27;).value = state.config.name;
        root.querySelector(&#x27;#workflow&#x27;).value = state.config.workflow;
        root.querySelector(&#x27;#header-mode&#x27;).value = state.config.headerMode;
        root.querySelector(&#x27;#concurrency&#x27;).value = state.config.concurrency;
        root.querySelector(&#x27;#evaluation-name&#x27;).value = state.evaluationName;
      }

      function renderValueEditor(variable) {
        const error = escapeHtml(validation[`variable-${variable.id}-value`] || &#x27;&#x27;);
        const label = &#x27;&lt;span class=&quot;mobile-label&quot;&gt;Value&lt;/span&gt;&#x27;;
        if (variable.source === &#x27;EXCEL&#x27;) {
          return `${label}&lt;input class=&quot;form-control&quot; data-variable-value value=&quot;${escapeHtml(variable.value)}&quot; placeholder=&quot;例如 col_2 或 col_4.checks.status&quot; aria-label=&quot;Excel 列路径&quot; /&gt;&lt;span class=&quot;field-error text-destructive&quot; data-error-value&gt;${error}&lt;/span&gt;`;
        }
        if (variable.type === &#x27;null&#x27;) {
          return `${label}&lt;input class=&quot;form-control&quot; value=&quot;无需填写&quot; disabled aria-label=&quot;null 无需填写值&quot; /&gt;&lt;span class=&quot;field-error text-destructive&quot; data-error-value&gt;${error}&lt;/span&gt;`;
        }
        if (variable.type === &#x27;boolean&#x27;) {
          return `${label}&lt;select class=&quot;form-select&quot; data-variable-value aria-label=&quot;自定义布尔值&quot;&gt;&lt;option value=&quot;true&quot;${selected(&#x27;true&#x27;, variable.value)}&gt;true&lt;/option&gt;&lt;option value=&quot;false&quot;${selected(&#x27;false&#x27;, variable.value)}&gt;false&lt;/option&gt;&lt;/select&gt;&lt;span class=&quot;field-error text-destructive&quot; data-error-value&gt;${error}&lt;/span&gt;`;
        }
        if (variable.type === &#x27;object&#x27; || variable.type === &#x27;array&#x27;) {
          const placeholder = variable.type === &#x27;object&#x27; ? &#x27;{&quot;field&quot;:&quot;value&quot;}&#x27; : &#x27;[&quot;item&quot;]&#x27;;
          return `${label}&lt;textarea class=&quot;form-control&quot; data-variable-value spellcheck=&quot;false&quot; placeholder=&quot;${escapeHtml(placeholder)}&quot; aria-label=&quot;自定义 ${escapeHtml(variable.type)} 值&quot;&gt;${escapeHtml(variable.value)}&lt;/textarea&gt;&lt;span class=&quot;field-error text-destructive&quot; data-error-value&gt;${error}&lt;/span&gt;`;
        }
        if (variable.type === &#x27;number&#x27; || variable.type === &#x27;integer&#x27;) {
          const step = variable.type === &#x27;integer&#x27; ? &#x27;1&#x27; : &#x27;any&#x27;;
          return `${label}&lt;input class=&quot;form-control&quot; data-variable-value type=&quot;number&quot; step=&quot;${step}&quot; value=&quot;${escapeHtml(variable.value)}&quot; placeholder=&quot;0&quot; aria-label=&quot;自定义 ${escapeHtml(variable.type)} 值&quot; /&gt;&lt;span class=&quot;field-error text-destructive&quot; data-error-value&gt;${error}&lt;/span&gt;`;
        }
        return `${label}&lt;input class=&quot;form-control&quot; data-variable-value value=&quot;${escapeHtml(variable.value)}&quot; placeholder=&quot;输入自定义值&quot; aria-label=&quot;自定义字符串值&quot; /&gt;&lt;span class=&quot;field-error text-destructive&quot; data-error-value&gt;${error}&lt;/span&gt;`;
      }

      function renderVariables() {
        const table = root.querySelector(&#x27;#injection-table&#x27;);
        if (!state.variables.length) {
          table.innerHTML = &#x27;&lt;div class=&quot;empty-state&quot;&gt;&lt;span&gt;暂无注入变量&lt;/span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-empty-add&gt;&lt;i data-lucide=&quot;plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;添加变量&lt;/button&gt;&lt;/div&gt;&#x27;;
        } else {
          table.innerHTML = `
            &lt;div class=&quot;injection-head&quot; role=&quot;row&quot;&gt;&lt;span&gt;#&lt;/span&gt;&lt;span&gt;Source&lt;/span&gt;&lt;span&gt;Key&lt;/span&gt;&lt;span&gt;Value&lt;/span&gt;&lt;span&gt;Type&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
            ${state.variables.map((variable, index) =&gt; `
              &lt;div class=&quot;injection-row&quot; role=&quot;row&quot; data-variable-id=&quot;${variable.id}&quot;&gt;
                &lt;span class=&quot;row-index&quot;&gt;${index + 1}&lt;/span&gt;
                &lt;label class=&quot;row-field&quot;&gt;&lt;span class=&quot;mobile-label&quot;&gt;Source&lt;/span&gt;&lt;select class=&quot;form-select&quot; data-variable-source&gt;&lt;option value=&quot;EXCEL&quot;${selected(&#x27;EXCEL&#x27;, variable.source)}&gt;Excel&lt;/option&gt;&lt;option value=&quot;CUSTOM&quot;${selected(&#x27;CUSTOM&#x27;, variable.source)}&gt;自定义&lt;/option&gt;&lt;/select&gt;&lt;span class=&quot;field-error text-destructive&quot; data-error-source&gt;${escapeHtml(validation[`variable-${variable.id}-source`] || &#x27;&#x27;)}&lt;/span&gt;&lt;/label&gt;
                &lt;label class=&quot;row-field&quot;&gt;&lt;span class=&quot;mobile-label&quot;&gt;Key&lt;/span&gt;&lt;input class=&quot;form-control&quot; data-variable-key value=&quot;${escapeHtml(variable.key)}&quot; placeholder=&quot;例如 question&quot; /&gt;&lt;span class=&quot;field-error text-destructive&quot; data-error-key&gt;${escapeHtml(validation[`variable-${variable.id}-key`] || &#x27;&#x27;)}&lt;/span&gt;&lt;/label&gt;
                &lt;label class=&quot;row-field&quot;&gt;${renderValueEditor(variable)}&lt;/label&gt;
                &lt;label class=&quot;row-field&quot;&gt;&lt;span class=&quot;mobile-label&quot;&gt;Type&lt;/span&gt;&lt;select class=&quot;form-select&quot; data-variable-type&gt;${typeOptions.map(([value, label]) =&gt; `&lt;option value=&quot;${value}&quot;${selected(value, variable.type)}&gt;${label}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;span class=&quot;field-error text-destructive&quot; data-error-type&gt;${escapeHtml(validation[`variable-${variable.id}-type`] || &#x27;&#x27;)}&lt;/span&gt;&lt;/label&gt;
                &lt;button class=&quot;btn btn-ghost row-delete&quot; type=&quot;button&quot; data-delete-variable aria-label=&quot;删除变量 ${index + 1}&quot; data-tooltip=&quot;删除变量&quot;&gt;&lt;i data-lucide=&quot;trash-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;
              &lt;/div&gt;
            `).join(&#x27;&#x27;)}`;
        }
        const excelCount = state.variables.filter(variable =&gt; variable.source === &#x27;EXCEL&#x27;).length;
        root.querySelector(&#x27;#variable-count&#x27;).textContent = `${state.variables.length} 个变量`;
        root.querySelector(&#x27;#dataset-meta&#x27;).textContent = `${currentSheet().rows} 行 · ${currentHeaders().length} 列 · Excel ${excelCount} / 自定义 ${state.variables.length - excelCount}`;
        root.querySelector(&#x27;#variables-global-error&#x27;).textContent = validation.variablesGlobal || &#x27;&#x27;;
        refreshIcons();
      }

      function renderRules() {
        const table = root.querySelector(&#x27;#rule-table&#x27;);
        if (!state.rules.length) {
          table.innerHTML = &#x27;&lt;div class=&quot;empty-state&quot;&gt;&lt;span&gt;暂无校验点&lt;/span&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-empty-rule&gt;&lt;i data-lucide=&quot;plus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;添加校验点&lt;/button&gt;&lt;/div&gt;&#x27;;
        } else {
          table.innerHTML = `
            &lt;div class=&quot;rule-head&quot; role=&quot;row&quot;&gt;&lt;span&gt;#&lt;/span&gt;&lt;span&gt;结果路径&lt;/span&gt;&lt;span&gt;运算符&lt;/span&gt;&lt;span&gt;预期值&lt;/span&gt;&lt;span&gt;Type&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;/div&gt;
            ${state.rules.map((rule, index) =&gt; `
              &lt;div class=&quot;rule-row&quot; role=&quot;row&quot; data-rule-id=&quot;${rule.id}&quot;&gt;
                &lt;span class=&quot;row-index&quot;&gt;${index + 1}&lt;/span&gt;
                &lt;label class=&quot;rule-cell&quot;&gt;&lt;span class=&quot;mobile-label&quot;&gt;结果路径&lt;/span&gt;&lt;input class=&quot;form-control&quot; data-rule-result value=&quot;${escapeHtml(rule.resultPath)}&quot; placeholder=&quot;context.final_answer.status&quot; /&gt;&lt;span class=&quot;field-error text-destructive&quot; data-error-result&gt;${escapeHtml(validation[`rule-${rule.id}-result`] || &#x27;&#x27;)}&lt;/span&gt;&lt;/label&gt;
                &lt;label class=&quot;rule-cell&quot;&gt;&lt;span class=&quot;mobile-label&quot;&gt;运算符&lt;/span&gt;&lt;select class=&quot;form-select&quot; data-rule-operator&gt;${operators.map(([value, label]) =&gt; `&lt;option value=&quot;${value}&quot;${selected(value, rule.operator)}&gt;${label}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/label&gt;
                &lt;label class=&quot;rule-cell&quot;&gt;&lt;span class=&quot;mobile-label&quot;&gt;预期值&lt;/span&gt;&lt;input class=&quot;form-control&quot; data-rule-value value=&quot;${escapeHtml(rule.expectedValue)}&quot; placeholder=&quot;PASS&quot; /&gt;&lt;span class=&quot;field-error text-destructive&quot; data-error-value&gt;${escapeHtml(validation[`rule-${rule.id}-value`] || &#x27;&#x27;)}&lt;/span&gt;&lt;/label&gt;
                &lt;label class=&quot;rule-cell&quot;&gt;&lt;span class=&quot;mobile-label&quot;&gt;Type&lt;/span&gt;&lt;select class=&quot;form-select&quot; data-rule-type&gt;${typeOptions.map(([value, label]) =&gt; `&lt;option value=&quot;${value}&quot;${selected(value, rule.type)}&gt;${label}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/label&gt;
                &lt;button class=&quot;btn btn-ghost&quot; type=&quot;button&quot; data-delete-rule aria-label=&quot;删除校验点 ${index + 1}&quot; data-tooltip=&quot;删除校验点&quot;&gt;&lt;i data-lucide=&quot;trash-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;
              &lt;/div&gt;
            `).join(&#x27;&#x27;)}`;
        }
        root.querySelector(&#x27;#rule-count&#x27;).textContent = state.rules.length;
        root.querySelector(&#x27;#rules-global-error&#x27;).textContent = validation.rulesGlobal || &#x27;&#x27;;
        refreshIcons();
      }

      function renderSummary() {
        root.querySelector(&#x27;#footer-summary&#x27;).textContent = `${currentSheet().rows} 个 Case · ${state.variables.length} 个变量 · ${state.rules.length} 个校验点`;
      }

      function renderAll() {
        normalizeDatasetState();
        syncBasicFields();
        renderVariables();
        renderRules();
        renderSummary();
        root.querySelector(&#x27;#error-name&#x27;).textContent = validation.name || &#x27;&#x27;;
        root.querySelector(&#x27;#error-concurrency&#x27;).textContent = validation.concurrency || &#x27;&#x27;;
        root.querySelector(&#x27;#error-evaluation-name&#x27;).textContent = validation.evaluationName || &#x27;&#x27;;
        root.querySelector(&#x27;#dirty-badge&#x27;).textContent = dirty ? &#x27;已修改&#x27; : &#x27;未修改&#x27;;
        refreshIcons();
      }

      function clearVariableErrors(id) {
        Object.keys(validation).filter(key =&gt; key.startsWith(`variable-${id}-`)).forEach(key =&gt; delete validation[key]);
        delete validation.variablesGlobal;
      }

      function parseCustomValue(variable) {
        const raw = variable.value.trim();
        if (variable.type === &#x27;number&#x27;) {
          if (!Number.isFinite(Number(raw))) throw new Error(&#x27;请输入有效 number&#x27;);
          return Number(raw);
        }
        if (variable.type === &#x27;integer&#x27;) {
          if (!Number.isInteger(Number(raw))) throw new Error(&#x27;请输入有效 integer&#x27;);
          return Number(raw);
        }
        if (variable.type === &#x27;boolean&#x27;) return raw === &#x27;true&#x27;;
        if (variable.type === &#x27;null&#x27;) return null;
        if (variable.type === &#x27;object&#x27; || variable.type === &#x27;array&#x27;) {
          let parsed;
          try { parsed = JSON.parse(raw); } catch (_error) { throw new Error(`${variable.type} 必须是合法 JSON`); }
          if (variable.type === &#x27;object&#x27; &amp;&amp; (parsed === null || Array.isArray(parsed) || typeof parsed !== &#x27;object&#x27;)) throw new Error(&#x27;JSON 顶层必须是 object&#x27;);
          if (variable.type === &#x27;array&#x27; &amp;&amp; !Array.isArray(parsed)) throw new Error(&#x27;JSON 顶层必须是 array&#x27;);
          return parsed;
        }
        return variable.value;
      }

      function validate() {
        validation = {};
        let firstSelector = &#x27;&#x27;;
        if (!state.config.name.trim()) {
          validation.name = &#x27;请输入 Run 名称&#x27;;
          firstSelector = &#x27;#run-name&#x27;;
        }
        if (!Number.isInteger(Number(state.config.concurrency)) || Number(state.config.concurrency) &lt; 1 || Number(state.config.concurrency) &gt; 32) {
          validation.concurrency = &#x27;请输入 1 到 32 的整数&#x27;;
          firstSelector ||= &#x27;#concurrency&#x27;;
        }
        if (!state.variables.length) {
          validation.variablesGlobal = &#x27;请至少添加一个注入变量&#x27;;
          firstSelector ||= &#x27;#add-variable&#x27;;
        }
        const keyOwners = new Map();
        state.variables.forEach(variable =&gt; {
          const prefix = `variable-${variable.id}-`;
          const key = variable.key.trim();
          if (!key) {
            validation[prefix + &#x27;key&#x27;] = &#x27;请输入 Key&#x27;;
            firstSelector ||= `[data-variable-id=&quot;${variable.id}&quot;] [data-variable-key]`;
          } else if (keyOwners.has(key)) {
            validation[prefix + &#x27;key&#x27;] = &#x27;Key 不能重复&#x27;;
            const firstId = keyOwners.get(key);
            validation[`variable-${firstId}-key`] = &#x27;Key 不能重复&#x27;;
            firstSelector ||= `[data-variable-id=&quot;${firstId}&quot;] [data-variable-key]`;
          } else {
            keyOwners.set(key, variable.id);
          }
          if (variable.source === &#x27;EXCEL&#x27;) {
            if (!/^col_[1-9]\d*(?:\.[A-Za-z_][A-Za-z0-9_]*|\[[0-9]+\])*$/.test(variable.value.trim())) {
              validation[prefix + &#x27;value&#x27;] = &#x27;请输入 col_x 或 col_x.field[index] 路径&#x27;;
              firstSelector ||= `[data-variable-id=&quot;${variable.id}&quot;] [data-variable-value]`;
            }
          } else if (variable.type !== &#x27;null&#x27; &amp;&amp; !variable.value.trim()) {
            validation[prefix + &#x27;value&#x27;] = &#x27;请输入自定义值&#x27;;
            firstSelector ||= `[data-variable-id=&quot;${variable.id}&quot;] [data-variable-value]`;
          } else if (variable.type !== &#x27;null&#x27;) {
            try { parseCustomValue(variable); } catch (error) {
              validation[prefix + &#x27;value&#x27;] = error.message;
              firstSelector ||= `[data-variable-id=&quot;${variable.id}&quot;] [data-variable-value]`;
            }
          }
        });
        if (!state.evaluationName.trim()) {
          validation.evaluationName = &#x27;请输入结果判定名称&#x27;;
          firstSelector ||= &#x27;#evaluation-name&#x27;;
        }
        if (!state.rules.length) {
          validation.rulesGlobal = &#x27;请至少添加一个校验点&#x27;;
          firstSelector ||= &#x27;#add-rule&#x27;;
        }
        state.rules.forEach(rule =&gt; {
          if (!rule.resultPath.trim().startsWith(&#x27;context.&#x27;)) {
            validation[`rule-${rule.id}-result`] = &#x27;结果路径必须以 context. 开头&#x27;;
            firstSelector ||= `[data-rule-id=&quot;${rule.id}&quot;] [data-rule-result]`;
          }
          if (rule.type !== &#x27;null&#x27; &amp;&amp; !rule.expectedValue.trim()) {
            validation[`rule-${rule.id}-value`] = &#x27;请输入预期值&#x27;;
            firstSelector ||= `[data-rule-id=&quot;${rule.id}&quot;] [data-rule-value]`;
          }
        });
        validation.firstSelector = firstSelector;
        renderAll();
        return !firstSelector;
      }

      function addVariable() {
        validation.variablesGlobal = &#x27;&#x27;;
        state.variables.push({id: nextVariableId++, source: &#x27;CUSTOM&#x27;, key: &#x27;&#x27;, value: &#x27;&#x27;, type: &#x27;string&#x27;});
        markDirty();
        renderVariables();
        renderSummary();
        root.querySelector(`[data-variable-id=&quot;${state.variables[state.variables.length - 1].id}&quot;] [data-variable-key]`)?.focus();
      }

      function addRule() {
        validation.rulesGlobal = &#x27;&#x27;;
        state.rules.push({id: nextRuleId++, resultPath: &#x27;context.&#x27;, operator: &#x27;EQ&#x27;, expectedValue: &#x27;&#x27;, type: &#x27;string&#x27;});
        markDirty();
        renderRules();
        renderSummary();
        root.querySelector(`[data-rule-id=&quot;${state.rules[state.rules.length - 1].id}&quot;] [data-rule-result]`)?.focus();
      }

      function openCreateReview() {
        hideNotice();
        if (!validate()) {
          root.querySelector(validation.firstSelector)?.focus();
          showNotice(&#x27;请完善配置&#x27;, &#x27;已定位到第一个需要处理的字段。&#x27;);
          return;
        }
        const excelCount = state.variables.filter(variable =&gt; variable.source === &#x27;EXCEL&#x27;).length;
        root.querySelector(&#x27;#review-content&#x27;).innerHTML = `
          &lt;div class=&quot;review-row&quot;&gt;&lt;span&gt;名称&lt;/span&gt;&lt;span&gt;${escapeHtml(state.config.name)}&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;review-row&quot;&gt;&lt;span&gt;测试集&lt;/span&gt;&lt;span&gt;${escapeHtml(state.config.dataset)} / ${escapeHtml(state.config.sheet)} · ${currentSheet().rows} 个 Case&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;review-row&quot;&gt;&lt;span&gt;Workflow&lt;/span&gt;&lt;span&gt;${escapeHtml(root.querySelector(&#x27;#workflow&#x27;).selectedOptions[0].textContent)}&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;review-row&quot;&gt;&lt;span&gt;变量注入&lt;/span&gt;&lt;span&gt;${state.variables.length} 个 · Excel ${excelCount} / 自定义 ${state.variables.length - excelCount}&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;review-row&quot;&gt;&lt;span&gt;结果判定&lt;/span&gt;&lt;span&gt;${escapeHtml(state.evaluationName)} · ${state.rules.length} 个校验点&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;review-row&quot;&gt;&lt;span&gt;Case 并发数&lt;/span&gt;&lt;span&gt;${escapeHtml(state.config.concurrency)}&lt;/span&gt;&lt;/div&gt;`;
        root.querySelector(&#x27;#review-stage&#x27;).classList.remove(&#x27;hidden&#x27;);
        root.querySelector(&#x27;#success-stage&#x27;).classList.add(&#x27;hidden&#x27;);
        root.querySelector(&#x27;#create-dialog&#x27;).showModal();
        refreshIcons();
      }

      function resetToInitial() {
        state = clone(initialState);
        validation = {};
        dirty = false;
        nextVariableId = 3;
        nextRuleId = 3;
        renderAll();
        hideNotice();
      }

      root.addEventListener(&#x27;input&#x27;, event =&gt; {
        const id = event.target.id;
        if (id === &#x27;run-name&#x27;) { state.config.name = event.target.value; validation.name = &#x27;&#x27;; }
        if (id === &#x27;concurrency&#x27;) { state.config.concurrency = event.target.value; validation.concurrency = &#x27;&#x27;; }
        if (id === &#x27;evaluation-name&#x27;) { state.evaluationName = event.target.value; validation.evaluationName = &#x27;&#x27;; }
        const variableRow = event.target.closest(&#x27;[data-variable-id]&#x27;);
        if (variableRow) {
          const variable = state.variables.find(item =&gt; item.id === Number(variableRow.dataset.variableId));
          if (event.target.matches(&#x27;[data-variable-key]&#x27;)) variable.key = event.target.value;
          if (event.target.matches(&#x27;[data-variable-value]&#x27;)) variable.value = event.target.value;
          clearVariableErrors(variable.id);
          variableRow.querySelectorAll(&#x27;.field-error&#x27;).forEach(element =&gt; { element.textContent = &#x27;&#x27;; });
        }
        const ruleRow = event.target.closest(&#x27;[data-rule-id]&#x27;);
        if (ruleRow) {
          const rule = state.rules.find(item =&gt; item.id === Number(ruleRow.dataset.ruleId));
          if (event.target.matches(&#x27;[data-rule-result]&#x27;)) rule.resultPath = event.target.value;
          if (event.target.matches(&#x27;[data-rule-value]&#x27;)) rule.expectedValue = event.target.value;
          delete validation[`rule-${rule.id}-result`];
          delete validation[`rule-${rule.id}-value`];
          ruleRow.querySelectorAll(&#x27;.field-error&#x27;).forEach(element =&gt; { element.textContent = &#x27;&#x27;; });
        }
        if (id || variableRow || ruleRow) {
          markDirty();
          renderSummary();
        }
      });

      root.addEventListener(&#x27;change&#x27;, event =&gt; {
        const id = event.target.id;
        if (id === &#x27;dataset&#x27;) {
          state.config.dataset = event.target.value;
          state.config.sheet = Object.keys(datasets[state.config.dataset].sheets)[0];
          normalizeDatasetState();
          markDirty();
          renderAll();
          return;
        }
        if (id === &#x27;sheet&#x27;) {
          state.config.sheet = event.target.value;
          normalizeDatasetState();
          markDirty();
          renderAll();
          return;
        }
        if (id === &#x27;workflow&#x27;) state.config.workflow = event.target.value;
        if (id === &#x27;header-mode&#x27;) state.config.headerMode = event.target.value;

        const variableRow = event.target.closest(&#x27;[data-variable-id]&#x27;);
        if (variableRow) {
          const variable = state.variables.find(item =&gt; item.id === Number(variableRow.dataset.variableId));
          if (event.target.matches(&#x27;[data-variable-source]&#x27;)) {
            variable.source = event.target.value;
            variable.value = variable.source === &#x27;EXCEL&#x27; ? &#x27;&#x27; : (variable.type === &#x27;boolean&#x27; ? &#x27;true&#x27; : variable.type === &#x27;object&#x27; ? &#x27;{}&#x27; : variable.type === &#x27;array&#x27; ? &#x27;[]&#x27; : &#x27;&#x27;);
          }
          if (event.target.matches(&#x27;[data-variable-type]&#x27;)) {
            variable.type = event.target.value;
            if (variable.source === &#x27;CUSTOM&#x27;) {
              if (variable.type === &#x27;null&#x27;) variable.value = &#x27;&#x27;;
              else if (variable.type === &#x27;boolean&#x27;) variable.value = &#x27;true&#x27;;
              else if (variable.type === &#x27;object&#x27;) variable.value = &#x27;{}&#x27;;
              else if (variable.type === &#x27;array&#x27;) variable.value = &#x27;[]&#x27;;
              else variable.value = &#x27;&#x27;;
            }
          }
          if (event.target.matches(&#x27;[data-variable-value]&#x27;)) variable.value = event.target.value;
          clearVariableErrors(variable.id);
          markDirty();
          renderVariables();
          renderSummary();
          return;
        }

        const ruleRow = event.target.closest(&#x27;[data-rule-id]&#x27;);
        if (ruleRow &amp;&amp; event.target.matches(&#x27;[data-rule-operator]&#x27;)) {
          const rule = state.rules.find(item =&gt; item.id === Number(ruleRow.dataset.ruleId));
          rule.operator = event.target.value;
        }
        if (ruleRow &amp;&amp; event.target.matches(&#x27;[data-rule-type]&#x27;)) {
          const rule = state.rules.find(item =&gt; item.id === Number(ruleRow.dataset.ruleId));
          rule.type = event.target.value;
          if (rule.type === &#x27;null&#x27;) rule.expectedValue = &#x27;null&#x27;;
        }
        if (id || ruleRow) markDirty();
      });

      root.addEventListener(&#x27;click&#x27;, event =&gt; {
        const create = event.target.closest(&#x27;[data-action=&quot;create&quot;]&#x27;);
        if (create) { openCreateReview(); return; }
        const cancel = event.target.closest(&#x27;[data-action=&quot;cancel&quot;]&#x27;);
        if (cancel) {
          if (dirty) root.querySelector(&#x27;#cancel-dialog&#x27;).showModal();
          else showNotice(&#x27;当前配置未修改&#x27;, &#x27;没有需要放弃的更改。&#x27;);
          return;
        }
        if (event.target.closest(&#x27;#add-variable&#x27;) || event.target.closest(&#x27;[data-empty-add]&#x27;)) { addVariable(); return; }
        if (event.target.closest(&#x27;#add-rule&#x27;) || event.target.closest(&#x27;[data-empty-rule]&#x27;)) { addRule(); return; }
        const variableRow = event.target.closest(&#x27;[data-variable-id]&#x27;);
        if (variableRow &amp;&amp; event.target.closest(&#x27;[data-delete-variable]&#x27;)) {
          state.variables = state.variables.filter(item =&gt; item.id !== Number(variableRow.dataset.variableId));
          markDirty();
          renderVariables();
          renderSummary();
          return;
        }
        const ruleRow = event.target.closest(&#x27;[data-rule-id]&#x27;);
        if (ruleRow &amp;&amp; event.target.closest(&#x27;[data-delete-rule]&#x27;)) {
          state.rules = state.rules.filter(item =&gt; item.id !== Number(ruleRow.dataset.ruleId));
          markDirty();
          renderRules();
          renderSummary();
        }
      });

      root.querySelector(&#x27;#cancel-keep&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; root.querySelector(&#x27;#cancel-dialog&#x27;).close());
      root.querySelector(&#x27;#cancel-discard&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelector(&#x27;#cancel-dialog&#x27;).close();
        resetToInitial();
        showNotice(&#x27;修改已放弃&#x27;, &#x27;Run 配置已恢复为打开编辑器时的状态。&#x27;);
      });
      root.querySelector(&#x27;#review-back&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; root.querySelector(&#x27;#create-dialog&#x27;).close());
      root.querySelector(&#x27;#confirm-create&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const runId = &#x27;RUN-20260729-021&#x27;;
        root.querySelector(&#x27;#success-content&#x27;).innerHTML = `
          &lt;div class=&quot;review-row&quot;&gt;&lt;span&gt;Run ID&lt;/span&gt;&lt;code&gt;${runId}&lt;/code&gt;&lt;/div&gt;
          &lt;div class=&quot;review-row&quot;&gt;&lt;span&gt;状态&lt;/span&gt;&lt;span&gt;待启动&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;review-row&quot;&gt;&lt;span&gt;执行规模&lt;/span&gt;&lt;span&gt;${currentSheet().rows} 个 Case · ${state.variables.length} 个变量 · ${state.rules.length} 个校验点&lt;/span&gt;&lt;/div&gt;`;
        root.querySelector(&#x27;#review-stage&#x27;).classList.add(&#x27;hidden&#x27;);
        root.querySelector(&#x27;#success-stage&#x27;).classList.remove(&#x27;hidden&#x27;);
        dirty = false;
        root.querySelector(&#x27;#dirty-badge&#x27;).textContent = &#x27;未修改&#x27;;
        refreshIcons();
      });
      root.querySelector(&#x27;#success-close&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; root.querySelector(&#x27;#create-dialog&#x27;).close());
      root.querySelector(&#x27;#view-run&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelector(&#x27;#create-dialog&#x27;).close();
        showNotice(&#x27;已打开新 Run&#x27;, &#x27;RUN-20260729-021 · 当前状态为待启动。&#x27;);
      });

      renderAll();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
