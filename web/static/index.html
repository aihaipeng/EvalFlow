<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>Agent Bench</title>
    <link rel="icon" type="image/png" sizes="100x100" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/execution.css" />
    <link rel="stylesheet" href="/model-providers.css" />
    <link rel="stylesheet" href="/assets/workflow-canvas.css" />
    <link rel="stylesheet" href="/assets/test-sets.css?v=0bb45cbb7bad" />
</head>
<body>
    <div class="app-layout">
        <!-- 左侧竖栏 -->
        <nav class="sidebar">
            <div class="sidebar-brand">Agent Bench</div>
            <ul class="sidebar-nav">
                <li class="sidebar-item active" data-view="sets"><span class="sidebar-icon" data-icon="database" aria-hidden="true"></span><span>测试集管理</span></li>
                <li class="sidebar-item" data-view="models"><span class="sidebar-icon" data-icon="providers" aria-hidden="true"></span><span>供应商管理</span></li>
                <li class="sidebar-item" data-view="workflows"><span class="sidebar-icon" data-icon="workflow" aria-hidden="true"></span><span>工作流管理</span></li>
                <li class="sidebar-item" data-view="batch-runs"><span class="sidebar-icon" data-icon="runs" aria-hidden="true"></span><span>运行调度</span></li>
            </ul>
            <div class="sidebar-footer">
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换到黑夜模式" aria-pressed="false" title="切换到黑夜模式">
                    <span class="theme-toggle-icon" data-icon="moon" aria-hidden="true"></span>
                    <span class="theme-toggle-label">黑夜模式</span>
                </button>
            </div>
        </nav>

        <!-- 右侧主内容区 -->
        <main class="content" id="content-area">
            <!-- 动态渲染 -->
        </main>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

    <div hidden aria-hidden="true">
        <input id="import-file-input" type="file" />
        <div id="import-file-list"></div>
        <textarea id="import-desc-input"></textarea>
        <button id="btn-import-save"></button>
        <button id="btn-import-cancel"></button>
        <div id="import-overlay"></div>
        <button id="btn-delete-confirm"></button>
        <button id="btn-delete-cancel"></button>
        <div id="delete-overlay"></div>
        <strong id="delete-count"></strong>
    </div>

    <script src="/assets/icons.js"></script>
    <script src="/model-providers.js"></script>
    <script src="/app.js"></script>
    <script src="/assets/test-sets.js?v=fa86667d92ca"></script>
    <script src="/assets/workflow-canvas.js?v=98f63b3d01eb"></script>
    <script src="/execution.js?v=cd0ed1e136c4"></script>
</body>
</html>
